[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arguments-growing-trees"
version = "0.1.0"
description = "Executable research demo for assessing hypotheses from evolving evidence"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "numpy>=1.24,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
train = ["torch>=2.2", "transformers>=4.45,<5"]

[project.scripts]
agt = "agt.cli:main"

[tool.setuptools.packages.find]
include = ["agt*"]

[tool.setuptools.package-data]
agt = ["web/*", "data/*"]
