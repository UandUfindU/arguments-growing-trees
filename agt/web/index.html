<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arguments as Growing Trees · Research Demo</title>
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#dce6ef;background:#0c1520;font-size:15px}*{box-sizing:border-box}body{margin:0}header{padding:30px 5vw 20px;border-bottom:1px solid #273747}h1{font-size:29px;margin:8px 0 12px;font-weight:600}h2{font-size:17px}.eyebrow{color:#75dbc9;letter-spacing:2px;font-size:12px}.muted{color:#91a8bc;line-height:1.7}.tag{display:inline-block;font-size:12px;border:1px solid #39536a;padding:5px 9px;border-radius:15px;margin:4px 7px 4px 0}main{padding:20px 5vw 40px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}button,select{background:#182b3d;color:#e6f1fa;border:1px solid #456077;border-radius:6px;padding:10px;cursor:pointer}button:hover{border-color:#75dbc9}.grid{display:grid;grid-template-columns:1.7fr 1fr;gap:20px}.panel{background:#121f2d;border:1px solid #2b4053;border-radius:10px;padding:20px;min-width:0}.tree{padding-left:0;list-style:none}.tree ul{list-style:none;border-left:1px solid #3b596e;margin:10px 0 10px 16px;padding-left:20px}.node{padding:12px 14px;border:1px solid #385267;border-radius:7px;margin-bottom:8px;background:#182937;cursor:pointer;line-height:1.6}.node:hover{background:#203748}.node.testable_evidence{border-left:4px solid #6fddbd}.node.textual_evidence{border-left:4px solid #d3b87c}.node.claim{border-left:4px solid #83baf7}.kind{font-size:11px;letter-spacing:1px;color:#9eb5c8}.stats{color:#79e2c3;font-size:12px}.untrained{color:#e8c47d;font-size:12px}.event{padding:9px 0;border-bottom:1px solid #293c4e;font-size:13px}.stage{color:#75dbc9;font-size:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.6;color:#a9bfd1;max-height:500px;overflow:auto}a{color:#84dccc}.empty{padding:40px}.notice{font-size:13px;line-height:1.8;background:#182b3a;padding:12px 15px;border-radius:7px;margin:15px 0}@media(max-width:900px){.grid{grid-template-columns:1fr}h1{font-size:23px}}
</style>
<header><div class="eyebrow">RECORDED RUN / SYSTEM1 UNTRAINED</div><h1>Arguments as Growing Trees</h1><div class="muted">输入自然语言假设 → S2 递归构树 → 代理验证 → 新证据更新。材料为预置来源摘录；规划与检验的实际后端见运行标记。</div><div id="badges"></div></header>
<main><div class="controls"><button id="prev">← 上一步</button><select id="steps"></select><button id="next">下一步 →</button><button id="play">播放回放</button><span class="stage" id="stage"></span></div>
<div class="grid"><section class="panel"><h2 id="hypothesis"></h2><div class="muted" id="time"></div><div class="notice" id="notice"></div><ul class="tree" id="tree"></ul></section><aside><section class="panel"><h2>这一步发生了什么</h2><div id="explain" class="muted"></div><div id="events"></div></section><section class="panel" style="margin-top:20px"><h2>节点与执行记录</h2><div class="muted">点击左侧节点，查看来源、检验设计和实际结果。</div><pre id="detail"></pre></section></aside></div>
<section class="panel" style="margin-top:20px"><h2>运行信息</h2><div id="meta" class="muted"></div></section></main>
<script>
const run=/* RUN_DATA */ null;
const $=id=>document.getElementById(id);let current=0,timer=null;
const stages={initialized:'首次初始化',mounted:'System 2 挂载新证据',immediate_update:'System 1 即时预测接口',background_verified:'后台实验完成',measured_replacement:'局部实测替换',duplicate_skipped:'重复来源去重',stale_verification:'版本变化，保留新状态'};
const descriptions={initialized:'System 2 将自然语言假设展开为子论断，并调用注册的数据与检验工具。初始树的叶节点都有实际执行记录。当前演示只覆盖已注册的代理检验范围。',mounted:'System 2 选择挂载位置，新建论断及其真实文本来源。此时还未调用 System 1。',immediate_update:'System 2 调用 System 1。输入保留完整论证树，同时遮蔽受影响路径的统计结果，仅预测新闻相对于目标论断的一个局部 log e。本次没有训练模型，因此预测值为空。System 2 随后异步开展代理验证。',background_verified:'后台工具完成实际检验，记录数据哈希、零假设、p 值与转换后的 e 值。统计有效性和根命题聚合仍需研究，相关性不能直接确认未来经营表现。',measured_replacement:'后台实测替换同一局部槽位；不将预测与实测相乘。仅显式声明有效顺序契约的路径可累积，其余路径数值为空。',duplicate_skipped:'同一事件或同源事件再次到达，系统记录重复投递并保留已有证据，不新增独立统计因子。'};
const fmt=x=>Number(x).toPrecision(4);
function show(){const s=run.history[current],t=s.tree;$('steps').value=current;$('stage').textContent=`revision ${t.revision} · ${current+1}/${run.history.length}`;$('hypothesis').textContent=t.hypothesis;$('time').textContent='根节点参考时间 '+t.root_time+' · 研究期限 '+(t.horizon||run.horizon||'未指定');$('explain').textContent=descriptions[s.stage]||s.stage;$('notice').textContent='System 1：未训练，预测值待提供。根命题概率与根 e 值暂不计算。叶节点显示实际检验结果及其适用范围。';const container=$('tree');container.replaceChildren();
function draw(n,host){const li=document.createElement('li'),box=document.createElement('div');box.className='node '+n.kind;const label=document.createElement('div');label.className='kind';label.textContent=n.kind.toUpperCase()+' · '+n.id+' · '+n.relation;box.append(label);const text=document.createElement('div');text.textContent=n.text;box.append(text);if(n.result){const r=document.createElement('div');r.className='stats';r.textContent=`实测 p=${fmt(n.result.p_value)} · e=${fmt(n.result.e_value)} · n=${n.result.sample_size} · 有效性待核查`;box.append(r)}if(n.prediction){const p=document.createElement('div');p.className='untrained';p.textContent='S1: 未训练 / log e = —';box.append(p)}box.onclick=()=>{$('detail').textContent=JSON.stringify(n,null,2)};li.append(box);const children=Object.values(t.nodes).filter(x=>x.parent===n.id);if(children.length){const ul=document.createElement('ul');children.forEach(x=>draw(x,ul));li.append(ul)}host.append(li)}draw(Object.values(t.nodes).find(n=>n.parent===null),container);$('events').replaceChildren();t.events.slice(-6).forEach(e=>{const d=document.createElement('div');d.className='event';d.textContent=`r${e.revision} · ${e.action}`;$('events').append(d)});$('detail').textContent=JSON.stringify(t.nodes.root,null,2)}
if(run){$('badges').textContent='';['System 2: '+(run.calls.find(c=>c.model)?.model||run.backend),'System 1: 未训练','模式: '+run.backend,'场景: '+run.scenario].forEach(t=>{const s=document.createElement('span');s.className='tag';s.textContent=t;$('badges').append(s)});run.history.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${stages[s.stage]||s.stage}`;$('steps').append(o)});$('steps').onchange=e=>{current=Number(e.target.value);show()};$('prev').onclick=()=>{current=Math.max(0,current-1);show()};$('next').onclick=()=>{current=Math.min(run.history.length-1,current+1);show()};$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='播放回放';return}current=0;show();$('play').textContent='暂停';timer=setInterval(()=>{if(current===run.history.length-1){clearInterval(timer);timer=null;$('play').textContent='播放回放'}else{current++;show()}},2200)};$('meta').textContent=`API / fixture 调用 ${run.calls.length} 次。训练执行：${run.training_executed}。所有阶段来自同一次运行的版本快照。`;show()}else{$('hypothesis').textContent='先运行 python -m agt.cli demo，生成可回放的 index.html。'}
</script></html>
